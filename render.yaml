# Backend server — kept for Render deployment (Express serves React frontend)
#
# Preview branch only: the build command also installs server/ dependencies and
# pins NODE_VERSION, matching upstream PR #474. Without the server install,
# `node server/index.js` exits with "Cannot find module 'express-rate-limit'".
services:
  - type: web
    name: tenali
    env: node
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
    buildCommand: npm ci && cd client && npm ci && npm run build && cd ../server && npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
